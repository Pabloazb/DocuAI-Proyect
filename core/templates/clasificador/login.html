<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicia sesión</title>
</head>
<body>

    <h1>Inicia sesión</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Iniciar sesión
        </button>
    </form>

    <p>
        ¿No tienescuenta?
        <a href="{% url 'registro' %}">
            Registrarte
        </a>
    </p>

</body>
</html>
