{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>DOCUAI - Crear cuenta</title>
    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
</head>

<body>
    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-logo">
                <a href="{% url 'inicio' %}">
                    DOCU<span>AI</span>
                </a>
            </div>

            <div class="auth-header">
                <h1>
                    Crear cuenta
                </h1>
                <p>
                    Regístrate para comenzar
                    a utilizar DOCUAI.
                </p>
            </div>

            <form method="post"class="auth-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit"
                        class="auth-button">

                    Crear cuenta
                </button>
            </form>

            <div class="auth-footer">
                ¿Ya tienes una cuenta?
                <a href="{% url 'login' %}">
                    Inicia sesión
                </a>
            </div>
        </div>
    </main>
</body>
</html>
